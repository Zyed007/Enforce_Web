<div *ngIf="showAddForm" class="kt-container  kt-container--fluid  kt-grid__item kt-grid__item--fluid">
         
    
 

       <div class="row">
          <div class="col-lg-12">
            <!--begin::Portlet-->
            <div class="kt-portlet">
                <div class="kt-portlet__head kt-portlet__head--lg">
                    <div class="kt-portlet__head-label">
                       
                        <h3 class="kt-portlet__head-title">
                          Activity
                        </h3>
                    </div>
                    <div class="kt-portlet__head-toolbar">
                        <div class="kt-portlet__head-wrapper">
                <!-- <a href="#" class="btn btn-clean btn-icon-sm">
                    <i class="la la-long-arrow-left"></i>
                    Back
                </a> -->
                &nbsp;
                <div class="dropdown dropdown-inline">
                    <!-- <button type="button" class="btn btn-brand btn-icon-sm"   aria-haspopup="true" aria-expanded="false"> -->
                          
                    <!-- </button> -->
              <button type="button"  (click)='TaskView()' class="button button-fill button-rose"  > <i class="fa fa-angle-left"></i> Back	</button>
                 
                </div>
            </div>		</div>
                </div>
             
              <!--begin::Form-->
              <form class="kt-form kt-form--label-right" [formGroup]="statusForm">
                <div class="kt-portlet__body">
                  <div class="form-group row">
                    <div class="col-lg-5">
                      <label>Activity</label>
                      <input type="email" class="form-control" placeholder="Enter Activity" formControlName="statusName">
                      <div *ngIf="addformSubmitted && (statusForm.get('statusName').status=='INVALID')" style="color: red;">Required</div>
                      <!-- <span class="form-text text-muted">Please enter your full name</span> -->
                    </div>
                   
                  </div>	 
                  <div class="form-group row">
                     
                      <div class="col-lg-5">
                          <label for="exampleTextarea">Description:</label>
                          <textarea class="form-control" id="exampleTextarea" rows="4" formControlName="desc"></textarea>
                        </div>
                    </div>	 
                 	                
                      </div>
          
                      
                      <div class="kt-portlet__foot">
                  <div class="kt-form__actions">
                    <div class="row">
                      <div class="col-lg-6">
                          <span *ngIf="AddNewSubmit">
                              <button type="submit" class="btn btn-success" style="margin-right:10px;" (click)=" onAddNewSubmit()">Submit & New</button>
                          </span>
                          <!-- <button type="reset" class="btn btn-success">Save</button> -->
                          <button type="submit" class="btn btn-success" (click)="editable ? onEditSubmit() : onAddSubmit()">Submit</button>

                          <button type="reset" class="btn btn-secondary" (click)='TaskView()' style="margin-left:10px;">Cancel</button>
                          <!-- <button type="reset" class="btn btn-success">Save</button> -->
                         
                        <!-- <button type="reset" class="btn btn-secondary" style="margin-left:5px;">Cancel</button> -->
                      </div>
                      <!-- <div class="col-lg-6 kt-align-right">
                        <button type="reset" class="btn btn-danger">Delete</button>
                      </div> -->
                    </div>
                  </div>
                </div>
              
             
              </form>
          
             
              
              
          
            </div>
          
          
          </div>
          </div>	
<!-- end:: Content -->				</div>
