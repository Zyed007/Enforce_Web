<div class="login-22">
  <div class="login-22-inner">
      <div class="container">
          <div class="row login-box">
              <div class="col-lg-8 align-self-center form-section">
                  <div class="form-inner">
                    <img src="../../assets/images/EnforceLogo1.PNG" class="imgPro" alt="logo">
                    <h3>Create an Account</h3>
                    <form>
                      <div class="row">
                        <div class="col-12 col-md-6">
                          <div class="form-group form-box">
                            <input type="text" name="name" class="form-control" placeholder="Full Name" aria-label="Full Name">
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-group form-box">
                            <input type="email" name="email" class="form-control" placeholder="Email Address" aria-label="Email Address">
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-group form-box clearfix">
                            <input type="password" name="password" class="form-control" autocomplete="off" placeholder="Password" aria-label="Password">
                          </div>
                        </div>
                        <div class="col-12 col-md-6">
                          <div class="form-group form-box clearfix">
                            <input type="password" name="password" class="form-control" autocomplete="off" placeholder="Confirm Password" aria-label="Password">
                          </div>
                        </div>
                      </div>
                      <div class="plandiv">
                        <p>Select a plan</p>
                        <div class="row">
                          <div class="col-3 wrapper">
                            <input type="radio" name="select" id="option-1" checked>
                            <label for="option-1" class="option option-1">
                              <div class="dot"></div>
                              <span>Basic</span>
                            </label>
                          </div>
                          <div class="col-3 wrapper">
                            <input type="radio" name="select" id="option-2">
                            <label for="option-2" class="option option-2">
                              <div class="dot"></div>
                              <span>Premium</span>
                            </label>
                          </div>
                        </div>
                      </div>
                      <div class="checkbox form-group form-box">
                          <div class="form-check checkbox-theme">
                              <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                              <label class="form-check-label" for="rememberMe">
                                  I agree to the<a href="#" class="terms">terms of service</a>
                              </label>
                          </div>
                      </div>
                      <div class="form-group mb-0 clearfix">
                          <button type="submit" class="btn-md btn-theme float-start">Register</button>
                      </div>
                    </form>
                  </div>
              </div>
              <div class="col-lg-4 align-self-center none-992 bg-img">
                  <div class="info clearfix">
                      <img src="../../assets/images/img-4.png" alt="bg">
                  </div>
              </div>
          </div>
      </div>
  </div>
</div>
